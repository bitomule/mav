<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="720" viewBox="0 0 1160 720" role="img" aria-labelledby="title desc">
  <title id="title">MAV driver router</title>
  <desc id="desc">MAV receives one agent command, maps it to a capability, routes it to the best iOS driver for the target, and records evidence for humans.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#243040"/>
    </marker>
    <marker id="soft-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M2,2 L10,6 L2,10 Z" fill="#6d7d90"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #17202c; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #4b5b70; }
      .label { font-size: 17px; font-weight: 700; }
      .small { font-size: 14px; fill: #4b5b70; }
      .tiny { font-size: 13px; fill: #607086; }
      .box { fill: #ffffff; stroke: #c9d3df; stroke-width: 2; rx: 8; }
      .agent { fill: #eef7f5; stroke: #66b3a6; }
      .router { fill: #fff5e6; stroke: #e1a449; }
      .evidence { fill: #f2f3ff; stroke: #8792d6; }
      .backend { fill: #f7fafc; stroke: #b8c5d4; }
      .sim { fill: #edf7ff; stroke: #5b9bd5; }
      .device { fill: #f6f9ee; stroke: #93ad4f; }
      .network { fill: #fff7ed; stroke: #d38d42; }
      .line { stroke: #243040; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .softline { stroke: #6d7d90; stroke-width: 1.8; fill: none; marker-end: url(#soft-arrow); stroke-dasharray: 6 6; }
    </style>
  </defs>

  <rect x="0" y="0" width="1160" height="720" fill="#f8fafc"/>
  <text x="48" y="58" class="title">MAV is the single iOS interface for agents</text>
  <text x="48" y="86" class="subtitle">Agents call one stable API. MAV picks the right native iOS driver and records proof.</text>

  <!-- Routes are drawn first, so boxes and labels always stay readable. -->
  <g id="routes">
    <path d="M278 202 H312" class="line"/>
    <path d="M570 202 H612" class="line"/>
    <path d="M445 282 V418" class="softline"/>
    <path d="M292 508 H612" class="line"/>
  </g>

  <rect x="48" y="144" width="230" height="116" class="box agent"/>
  <text x="76" y="180" class="label">Agent / Flow</text>
  <text x="76" y="209" class="small">tree, tap, type, wait</text>
  <text x="76" y="231" class="small">pinch, capture, logs</text>
  <text x="76" y="253" class="small">video + network evidence</text>

  <rect x="320" y="126" width="250" height="156" class="box router"/>
  <text x="350" y="164" class="label">Capability Router</text>
  <text x="350" y="196" class="small">1. target: simulator or device</text>
  <text x="350" y="220" class="small">2. capability: semantic tap, video...</text>
  <text x="350" y="244" class="small">3. driver health + preference</text>
  <text x="350" y="268" class="small">4. lowest deterministic cost wins</text>

  <text x="292" y="188" class="tiny">one API</text>
  <text x="584" y="188" class="tiny">selected backend</text>

  <rect x="612" y="104" width="360" height="220" class="box backend"/>
  <text x="640" y="142" class="label">Native iOS Driver Backends</text>

  <rect x="640" y="166" width="140" height="56" class="box"/>
  <text x="658" y="190" class="small">AXe: a11y</text>
  <text x="658" y="210" class="tiny">semantic UI</text>

  <rect x="802" y="166" width="140" height="56" class="box sim"/>
  <text x="820" y="190" class="small">Baguette</text>
  <text x="820" y="210" class="tiny">sim HID</text>

  <rect x="640" y="242" width="140" height="56" class="box device"/>
  <text x="658" y="266" class="small">idb</text>
  <text x="658" y="286" class="tiny">device control</text>

  <rect x="802" y="242" width="140" height="56" class="box sim"/>
  <text x="820" y="266" class="small">simctl</text>
  <text x="820" y="286" class="tiny">launch + video</text>

  <rect x="700" y="336" width="190" height="64" class="box network"/>
  <text x="720" y="374" class="small">mitmproxy: HAR capture</text>

  <rect x="116" y="418" width="352" height="176" class="box evidence"/>
  <text x="146" y="458" class="label">Evidence Window</text>
  <text x="146" y="490" class="small">video.start / evidence.start</text>
  <text x="146" y="514" class="small">named screenshots + tree snapshots</text>
  <text x="146" y="538" class="small">logs, crashes, optional network HAR</text>
  <text x="146" y="562" class="small">report.json for the HTML report</text>

  <rect x="612" y="452" width="360" height="112" class="box"/>
  <text x="640" y="492" class="label">Verified artifacts</text>
  <text x="640" y="524" class="small">video.mov / video.mp4</text>
  <text x="640" y="548" class="small">steps/*.png, logs.txt, network.har</text>

  <text x="474" y="352" class="tiny">evidence uses the same router decisions</text>

  <text x="48" y="668" class="subtitle">The router is the product boundary: agents express intent once.</text>
  <text x="48" y="696" class="subtitle">MAV chooses the right iOS backend and records proof.</text>
</svg>
