name: Homebrew

on:
  workflow_dispatch:
    inputs:
      tag-name:
        description: Git tag to publish in the Homebrew tap, e.g. v0.0.1
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag-name }}
        run: |
          tag="$INPUT_TAG"
          case "$tag" in
            v*) ;;
            *) echo "Expected a v* tag, got: $tag" >&2; exit 1 ;;
          esac
          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download release checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern checksums.txt --dir /tmp/mav-release

      - name: Render formula
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          arm64_sha="$(awk '$2 == "mav-darwin-arm64" { print $1 }' /tmp/mav-release/checksums.txt)"
          amd64_sha="$(awk '$2 == "mav-darwin-amd64" { print $1 }' /tmp/mav-release/checksums.txt)"
          test -n "$arm64_sha"
          test -n "$amd64_sha"
          mkdir -p /tmp/homebrew-formula/Formula
          python3 packaging/homebrew/render.py "$TAG" /tmp/mav-release/checksums.txt /tmp/homebrew-formula/Formula/mav.rb
          ruby -c /tmp/homebrew-formula/Formula/mav.rb

      - name: Checkout tap
        uses: actions/checkout@v4
        with:
          repository: bitomule/homebrew-tap
          token: ${{ secrets.COMMITTER_TOKEN }}
          path: homebrew-tap

      - name: Publish formula
        working-directory: homebrew-tap
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cp /tmp/homebrew-formula/Formula/mav.rb Formula/mav.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/mav.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date for $TAG"
            exit 0
          fi
          git commit -m "Update mav to $VERSION"
          git push
